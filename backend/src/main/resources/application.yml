spring:
  application:
    name: syntaxmath-backend
  profiles:
    default: dev

syntaxmath:
  auth:
    cookie-name: syntaxmath_session
    cookie-secure: true
    session-lifetime: 7d
    allowed-origin: ${FRONTEND_ORIGIN}
    login-rate-limit-ip-attempts: 30
    login-rate-limit-account-attempts: 10
    login-rate-limit-window: 15m
    login-failure-lockout-threshold: 5
    login-failure-lockout-duration: 15m
    email-verification-lifetime: 24h
    password-reset-lifetime: 30m
  email:
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM_EMAIL:}
